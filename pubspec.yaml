name: under_control
description: "Undercontroll mobil uygulama geliştirimi"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2

  # 🔥 Firebase Paketleri
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.1
  firebase_messaging: ^15.1.5
  firebase_storage: ^12.3.7
  lottie: ^3.1.0   # ← Bu satırı ekle
  cloud_functions: ^5.1.3

  
  # 📷 Image Picker & Caching
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  
  # 🎨 State Management
  provider: ^6.1.2
  intl: ^0.20.2
  
  # 🌐 HTTP
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

# 🎨 App Icon Ayarları
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/icon/
    - assets/animations/
